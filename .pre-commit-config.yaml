# `uvx pre-commit install --hook-type pre-commit --hook-type pre-push` runs these before each
# commit (pytest before each push). mypy joins once the code passes it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files   # stops a model checkpoint entering git history
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x, --severity=warning]   # info notes (ls in counts, sourced env.sh) are not defects

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]           # too slow for every commit
